# Default values for the scale-sentry chart.

# -- Override the chart name used in resource names
nameOverride: ""
# -- Override the full release name
fullnameOverride: ""

controller:
  # -- Number of controller replicas; >1 enables HA (renders a PodDisruptionBudget + topology spread)
  replicaCount: 1
  image:
    # -- Controller image repository
    repository: ghcr.io/ethan-kane-ops/scale-sentry
    # -- Controller image tag; empty falls back to .Chart.AppVersion so releases only bump Chart.yaml
    tag: ""
    # -- Controller image pull policy
    pullPolicy: IfNotPresent
  # -- Controller resource requests/limits. No CPU limit by design (let the kernel scheduler arbitrate); memory is the only hard cap.
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  # -- Enable leader election so multi-replica deployments are safe. A standby takes over within the lease-renew window (~15s) if the leader dies.
  leaderElect: true
  # -- Verbose development logging
  devLogging: false
  # -- imagePullSecrets for the controller Deployment AND the loadgen/observer Job pods it creates. Job pods are separate objects pulling the same images, so a private registry needs this set here rather than on the ServiceAccount alone.
  imagePullSecrets: []
  # -- Node labels the controller must be scheduled onto
  nodeSelector: {}
  # -- Taints the controller tolerates
  tolerations: []
  # -- Affinity rules for the controller. Note replicaCount > 1 already renders topologySpreadConstraints; set this only for placement beyond that.
  affinity: {}
  # -- PriorityClass for the controller. Worth setting: a controller evicted under node pressure stops reconciling silently.
  priorityClassName: ""
  # -- Extra annotations on the controller pod (scrape config, mesh injection opt-out, cost allocation)
  podAnnotations: {}
  # -- Extra labels on the controller pod
  podLabels: {}
  # -- Topology spread constraints, rendered only when replicaCount > 1. Default: prefer spreading replicas across zones.
  topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
  # -- PodDisruptionBudget, rendered only when replicaCount > 1
  podDisruptionBudget:
    minAvailable: 1
  # -- Pod-level securityContext for the controller. Default satisfies PodSecurityAdmission "Restricted" (runAsNonRoot, seccomp RuntimeDefault).
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  # -- Container-level securityContext for the controller. Default satisfies PodSecurityAdmission "Restricted" (drop ALL caps, no privilege escalation, read-only root fs).
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault

# -- Loadgen Job image the controller injects. Empty composes the default GHCR path at .Chart.AppVersion.
loadgenImage: ""
# -- Observer Job image the controller injects. Empty composes the default GHCR path at .Chart.AppVersion.
observerImage: ""

# -- Observer ServiceAccount name, used by the loadgen Job's observer sidecar and by the RBAC rendered for every namespace in observer.namespaces.
observerServiceAccount: scale-sentry-observer

observer:
  # -- Extra namespaces to install observer RBAC into. The release namespace is always covered. A ScaleValidation in a namespace missing from this list produces an observer with no permissions, so its run degrades to an Unknown verdict. Example: `[staging, payments]`.
  namespaces: []

serviceAccount:
  # -- Create the controller ServiceAccount
  create: true
  # -- Annotations to add to the controller ServiceAccount
  annotations: {}

# -- rbac.create gates the controller manager ClusterRole + binding only. The observer RBAC (symlinked from config/) is always installed because the operator cannot function without it.
rbac:
  create: true
  # -- Extra ClusterRole rules appended to the manager role. Needed when spec.targetRef names a scalable workload outside apps/v1, e.g. `[{apiGroups: [argoproj.io], resources: [rollouts, rollouts/scale], verbs: [get, list, watch]}]`.
  extraRules: []

# metrics controls the Prometheus scrape surface for the controller. Both gates
# are off by default so the chart is self-contained on clusters without
# prometheus-operator installed.
metrics:
  service:
    # -- Create a ClusterIP Service fronting the controller's :8080/metrics port
    enabled: false
    # -- Metrics Service port
    port: 8080
    # -- Annotations to add to the metrics Service
    annotations: {}
  serviceMonitor:
    # -- Create a prometheus-operator ServiceMonitor pointed at the metrics Service
    enabled: false
    # -- Scrape interval
    interval: 30s
    # -- Scrape timeout
    scrapeTimeout: 10s
    # -- Extra labels for the ServiceMonitor (e.g. to match a Prometheus selector)
    labels: {}
    # -- ServiceMonitor relabelings
    relabelings: []
    # -- ServiceMonitor metric relabelings
    metricRelabelings: []
