apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "scale-sentry.fullname" . }}-controller
  labels:
    {{- include "scale-sentry.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicaCount }}
  selector:
    matchLabels:
      {{- include "scale-sentry.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      {{- with .Values.controller.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "scale-sentry.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller
        {{- with .Values.controller.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "scale-sentry.controllerServiceAccountName" . }}
      {{- with .Values.controller.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- with .Values.controller.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and (gt (int .Values.controller.replicaCount) 1) .Values.controller.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range .Values.controller.topologySpreadConstraints }}
        - maxSkew: {{ .maxSkew }}
          topologyKey: {{ .topologyKey }}
          whenUnsatisfiable: {{ .whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "scale-sentry.selectorLabels" $ | nindent 14 }}
              app.kubernetes.io/component: controller
        {{- end }}
      {{- end }}
      containers:
      - name: controller
        image: "{{ .Values.controller.image.repository }}:{{ .Values.controller.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
        {{- with .Values.controller.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        args:
        - controller
        - --loadgen-image={{ .Values.loadgenImage | default (printf "ghcr.io/ethan-kane-ops/scale-sentry-loadgen:%s" .Chart.AppVersion) }}
        - --observer-image={{ .Values.observerImage | default (printf "ghcr.io/ethan-kane-ops/scale-sentry-observer:%s" .Chart.AppVersion) }}
        - --observer-service-account={{ .Values.observerServiceAccount }}
        {{- range .Values.controller.imagePullSecrets }}
        - --image-pull-secret={{ . }}
        {{- end }}
        - --leader-elect={{ .Values.controller.leaderElect }}
        {{- if .Values.controller.devLogging }}
        - --dev-logging
        {{- end }}
        ports:
        - name: metrics
          containerPort: 8080
        - name: probe
          containerPort: 8081
        readinessProbe:
          httpGet:
            path: /readyz
            port: probe
          initialDelaySeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: probe
          initialDelaySeconds: 15
        resources:
          {{- toYaml .Values.controller.resources | nindent 10 }}
