{{- if .Values.rbac.create -}}
# Cluster-scoped binding for the observer SA's kubelet cAdvisor scrape.
# The Role / RoleBinding for the namespaced reads live in
# observer-rbac.yaml (symlinked from config/rbac/observer_role.yaml); the
# ClusterRole itself ships in that same file. Only the binding needs Helm
# templating, because cluster-scoped bindings have to name the SA's
# namespace explicitly and the release namespace is only known here.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: scale-sentry-observer-cadvisor-{{ .Release.Namespace }}
  labels:
    {{- include "scale-sentry.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: scale-sentry-observer-cadvisor
subjects:
- kind: ServiceAccount
  name: scale-sentry-observer
  namespace: {{ .Release.Namespace }}
{{- end -}}
