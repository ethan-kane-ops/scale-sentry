{{- if .Values.rbac.create -}}
# Cluster-scoped binding for the observer SA's kubelet cAdvisor scrape.
# The Role / RoleBinding for the namespaced reads live in
# observer-rbac.yaml, along with the ClusterRole this binds to. Only the
# binding needs the namespace list, because cluster-scoped bindings have
# to name each SA's namespace explicitly.
{{- $namespaces := prepend (.Values.observer.namespaces | default list) .Release.Namespace | uniq }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: scale-sentry-observer-cadvisor-{{ .Release.Namespace }}
  labels:
    {{- include "scale-sentry.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: scale-sentry-observer-cadvisor
subjects:
{{- range $ns := $namespaces }}
- kind: ServiceAccount
  name: {{ $.Values.observerServiceAccount }}
  namespace: {{ $ns }}
{{- end }}
{{- end -}}
