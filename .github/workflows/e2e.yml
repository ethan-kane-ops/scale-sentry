name: E2E

# Gated on demand:
#   workflow_dispatch: manual UI / gh CLI trigger
#   pull_request labeled with "run-e2e": reviewer opts in
#   nightly cron: regression backstop
# Not on every push/PR (cf. ENG-62) — kind smoke is 8-10 minutes and blocks
# trivial doc/refactor PRs disproportionately.
on:
  workflow_dispatch:
    inputs:
      full_matrix:
        description: "Run the full scenario matrix (Envoy Gateway + protocol fixtures + disruption)"
        type: boolean
        default: false
  schedule:
    - cron: "23 5 * * *"
  pull_request:
    types: [labeled]
    branches: [main]

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-images:
    name: build images
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-e2e'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          # Tag controller as plain `scale-sentry:dev` to match the chart's
          # default image.repository (just deploy override pattern).
          - cmd: scale-sentry
            image: scale-sentry
          - cmd: loadgen
            image: scale-sentry-loadgen
          - cmd: observer
            image: scale-sentry-observer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          build-args: |
            CMD=${{ matrix.cmd }}
          tags: ${{ matrix.image }}:dev
          push: false
          outputs: type=docker,dest=/tmp/${{ matrix.image }}.tar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.4.3
        with:
          name: image-${{ matrix.cmd }}
          path: /tmp/${{ matrix.image }}.tar
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: kind smoke E2E
    needs: build-images
    runs-on: ubuntu-latest
    # The full matrix (protocol fixtures, Envoy Gateway path, disruption
    # run) rides the nightly cron and the dispatch opt-in; PR-labeled runs
    # stay smoke-only to hold the ENG-62 time budget.
    env:
      E2E_FULL_MATRIX: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_matrix)) && '1' || '' }}
      # Matrix fixtures assert HPA convergence inside a tight, real-time SLA
      # window (2m). ubuntu-latest is a 2-core shared runner already busy
      # with kind + metrics-server + Envoy Gateway, so scrape/sync-loop
      # jitter can eat into that window. Widen the fixtures' own SLA by 50%
      # here only; local runs against dedicated capacity keep the documented
      # values (multiplier unset -> 1).
      #
      # This is margin, not a flake fix. The long-running nightly failures
      # were never a blown window: they reported reaction=0s, meaning the
      # HPA never fired at all. That had two causes, both fixed at source -
      # fixture CPU requests set too high to ever cross their own target,
      # and no cold-start reset between scenarios. If a scenario fails
      # again, read `reaction` before reaching for this knob.
      E2E_SLA_MULTIPLIER: "1.5"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Cache kind node image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/kind
          key: kind-node-${{ runner.os }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-*
          path: /tmp/images
          merge-multiple: true
      - name: Load images locally
        run: |
          for tar in /tmp/images/*.tar; do
            docker load -i "$tar"
          done
          docker image ls scale-sentry-*
      - name: Pre-warm hpa-example image
        run: docker pull registry.k8s.io/hpa-example
      - name: Pre-warm matrix fixture images
        if: env.E2E_FULL_MATRIX == '1'
        # DockerHub pulls (traefik/whoami, caddy) are pinned by digest, not
        # just tag: unauthenticated docker.io is rate-limited per-IP, and
        # GitHub-hosted runners share a small egress IP pool, so an
        # unpinned tag is both a drift risk and a flakiness risk. Everything
        # else here is already on registry.k8s.io, which isn't rate-limited.
        #
        # `docker pull name:tag@digest` stores the result keyed by digest
        # only — it does not also register the bare `name:tag` locally. The
        # explicit retag below is required so `kind load docker-image
        # name:tag` (next step) can resolve it.
        run: |
          docker pull traefik/whoami:v1.10.3@sha256:43a68d10b9dfcfc3ffbfe4dd42100dc9aeaf29b3a5636c856337a5940f1b4f1c
          docker tag traefik/whoami@sha256:43a68d10b9dfcfc3ffbfe4dd42100dc9aeaf29b3a5636c856337a5940f1b4f1c traefik/whoami:v1.10.3
          docker pull caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
          docker tag caddy@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648 caddy:2.11.4-alpine
          docker pull registry.k8s.io/e2e-test-images/agnhost:2.53
      - name: Create kind cluster
        run: kind create cluster --name scale-sentry-e2e
      - name: Load images into kind
        run: |
          kind load docker-image --name scale-sentry-e2e \
            scale-sentry:dev \
            scale-sentry-loadgen:dev \
            scale-sentry-observer:dev \
            registry.k8s.io/hpa-example
      - name: Load matrix fixture images into kind
        if: env.E2E_FULL_MATRIX == '1'
        run: |
          kind load docker-image --name scale-sentry-e2e \
            traefik/whoami:v1.10.3 \
            caddy:2.11.4-alpine \
            registry.k8s.io/e2e-test-images/agnhost:2.53
      - name: Install Gateway API CRDs + Envoy Gateway
        if: env.E2E_FULL_MATRIX == '1'
        run: just envoy-gateway
      - name: Helm install chart
        run: |
          helm upgrade --install scale-sentry charts/scale-sentry \
            --set controller.image.repository=scale-sentry \
            --set controller.image.tag=dev \
            --set loadgenImage=scale-sentry-loadgen:dev \
            --set observerImage=scale-sentry-observer:dev
          kubectl wait --for=condition=Available --timeout=120s \
            -n default deployment/scale-sentry-controller
      # No @latest: module-aware install resolves through go.mod + go.sum
      # (hack/tools.go tracks the tool), same pattern as ci.yml.
      - name: Install gotestsum
        run: go install gotest.tools/gotestsum
      - name: Run E2E suite
        run: |
          gotestsum \
            --format testname \
            --rerun-fails=1 \
            --packages=./test/e2e/... \
            -- \
            -tags e2e \
            -count=1 \
            -timeout=45m
      - name: Dump diagnostics on failure
        if: failure()
        run: hack/e2e-diagnostics.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.4.3
        if: failure()
        with:
          name: e2e-diagnostics
          path: /tmp/e2e-diagnostics
          retention-days: 7

  # Nightly envtest sweep against the two Kubernetes minors behind the
  # go.mod k8s.io/* pin, enforcing the README's ">= 1.34" support claim.
  # The regular CI job already covers the current minor.
  envtest-matrix:
    name: envtest k8s ${{ matrix.k8s }}
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_matrix)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        k8s: ["1.35", "1.34"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Install setup-envtest
        run: go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
      - name: Run envtest suite against k8s ${{ matrix.k8s }}
        run: |
          KUBEBUILDER_ASSETS="$(setup-envtest use ${{ matrix.k8s }} -p path)"
          export KUBEBUILDER_ASSETS
          go test -tags envtest -count=1 ./internal/controller/...
