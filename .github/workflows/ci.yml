name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "CHANGELOG.md"
      - "mkdocs.yml"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "CHANGELOG.md"
      - "mkdocs.yml"
      - ".github/ISSUE_TEMPLATE/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: tidy + lint + test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Tidy + lint
        run: |
          just tidy
          just lint
      # No @latest: module-aware installs resolve through go.mod + go.sum
      # (hack/tools.go tracks the tools), so versions are hash-pinned.
      - name: Install gotestsum
        run: go install gotest.tools/gotestsum
      - name: Install setup-envtest (envtest assets cache)
        run: go install sigs.k8s.io/controller-runtime/tools/setup-envtest
      - name: Cache envtest assets
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.local/share/kubebuilder-envtest
          key: envtest-${{ runner.os }}-${{ hashFiles('go.mod') }}
          restore-keys: |
            envtest-${{ runner.os }}-
      - name: Test + coverage
        run: |
          KUBEBUILDER_ASSETS="$(setup-envtest use -p path)"
          export KUBEBUILDER_ASSETS
          gotestsum \
            --format pkgname \
            --rerun-fails=1 \
            --packages=./... \
            --junitfile junit.xml \
            -- \
            -tags envtest \
            -race \
            -covermode=atomic \
            -coverpkg=./internal/...,./api/... \
            -coverprofile=coverage.out
      - name: Publish JUnit summary
        if: always()
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v5.6.2
        with:
          report_paths: junit.xml
          require_tests: true
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.out
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  manifest-drift:
    name: generated manifests in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: just generate manifests
      - name: Fail if generated files drifted
        run: git diff --exit-code -- api/ config/

  chart-rbac-check:
    name: chart manager RBAC in sync with config/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: just chart-rbac-check

  kubeconform:
    name: kubeconform manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: |
          kubeconform -strict -summary -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            config/crd/bases config/rbac config/samples

  images:
    name: docker build (${{ matrix.cmd }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cmd: [scale-sentry, loadgen, observer]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          build-args: |
            CMD=${{ matrix.cmd }}
          tags: scale-sentry-${{ matrix.cmd }}:ci
          push: false
          outputs: type=docker,dest=/tmp/scale-sentry-${{ matrix.cmd }}.tar
      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.4.3
        with:
          name: image-${{ matrix.cmd }}
          path: /tmp/scale-sentry-${{ matrix.cmd }}.tar
          retention-days: 1
          if-no-files-found: error

  summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs: [check, manifest-drift, chart-rbac-check, kubeconform, images]
    if: always()
    steps:
      - name: Verify required jobs succeeded
        run: |
          if [[ "${{ needs.check.result }}" != "success" \
             || "${{ needs.manifest-drift.result }}" != "success" \
             || "${{ needs.chart-rbac-check.result }}" != "success" \
             || "${{ needs.kubeconform.result }}" != "success" \
             || "${{ needs.images.result }}" != "success" ]]; then
            echo "✗ one or more required jobs failed"
            exit 1
          fi
          echo "✓ all required jobs passed"
