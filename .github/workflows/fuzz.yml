name: fuzz

# Native Go fuzzing on the parsers that eat untrusted or semi-trusted text
# (cgroup cpu.stat, cAdvisor scrape, observer report log, shadow annotations).
# Weekly rather than per-PR: the corpus grows over time and a 20-minute budget
# has no place on the PR critical path. Crashers land as testdata seeds.
on:
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz parsers
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Fuzz (5 minutes per target)
        run: just fuzz 300s
      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.4.3
        with:
          name: fuzz-crashers
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore
