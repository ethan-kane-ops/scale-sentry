name: Chart

on:
  push:
    branches: [main]
    paths:
      - 'charts/**'
      - '.github/workflows/chart.yml'
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/chart.yml'

concurrency:
  group: chart-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ct lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

      - uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: ct lint
        run: |
          ct lint \
            --charts charts/scale-sentry \
            --check-version-increment=false \
            --validate-maintainers=false

  docs:
    name: chart README in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          experimental: true

      - name: Regenerate chart README
        run: just chart-docs

      - name: Fail if chart README drifted
        run: git diff --exit-code -- charts/
