name: govulncheck

# Vuln DB updates daily; per-PR gating churns trivial PRs whenever a new
# stdlib CVE drops (see ENG-55..60 stack burn). Run on push to main + daily
# cron, plus on-demand. cert-manager + external-secrets convention.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: govulncheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck (${{ matrix.cmd }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cmd: [scale-sentry, loadgen, observer]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # No @latest: resolves through go.mod + go.sum (hack/tools.go).
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck
      - name: Scan ./cmd/${{ matrix.cmd }}
        run: govulncheck -show verbose ./cmd/${{ matrix.cmd }}
