name: setup
description: Checkout + setup-go (with module + build cache) + mise. Shared by every workflow job.

inputs:
  go-build-cache:
    description: "Cache ~/.cache/go-build keyed by go.sum (set false to skip)."
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: go.mod
        cache: true

    - name: Cache go-build
      if: inputs.go-build-cache == 'true'
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: ~/.cache/go-build
        key: go-build-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          go-build-${{ runner.os }}-

    - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      with:
        experimental: true
