# whoami target Deployment + Service + HPA for HTTP/1.1.
#
# whoami is a tiny echo server; the h2c sibling lives in h2c-echo.yaml
# (whoami, like any Go net/http server, only speaks h2 over TLS).
# Separate Deployments keep each protocol's HPA reacting in isolation
# (an h1 scale event does not move the h2 baseline).
#
# Resources:
#   requests.cpu=25m, limits.cpu=200m; CPU-only HPA target=70% (~18m).
#   whoami is an extremely cheap echo (~0.1ms CPU per request), so the
#   low request is what lets fixture-level load (~400 RPS) cross the
#   scale-up threshold decisively; at 50m it hovers just under target.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami-h1
  namespace: scale-sentry-e2e
  labels: { app: whoami-h1 }
spec:
  replicas: 1
  selector: { matchLabels: { app: whoami-h1 } }
  template:
    metadata:
      labels: { app: whoami-h1 }
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.3
          args: ["--port=8080"]
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 64Mi }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: whoami-h1
  namespace: scale-sentry-e2e
spec:
  selector: { app: whoami-h1 }
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: whoami-h1
  namespace: scale-sentry-e2e
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: whoami-h1
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
