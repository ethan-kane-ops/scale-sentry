# whoami target Deployments + Services + HPAs for HTTP/1.1 and HTTP/2.
#
# whoami is a tiny echo server that supports both wire protocols on the
# same image. Two Deployments are used so each protocol's HPA reacts in
# isolation (an h1 scale event does not move the h2 baseline).
#
# Container args:
#   - http1: no extra flag; serves HTTP/1.1 on :80.
#   - http2: --h2c on :80 so cleartext h2 is accepted without TLS.
#
# Resources:
#   requests.cpu=50m, limits.cpu=200m; CPU-only HPA target=70% giving
#   ~35m baseline → scale signal under any meaningful load.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami-h1
  namespace: scale-sentry-e2e
  labels: { app: whoami-h1 }
spec:
  replicas: 1
  selector: { matchLabels: { app: whoami-h1 } }
  template:
    metadata:
      labels: { app: whoami-h1 }
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.3
          args: ["--port=8080"]
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 64Mi }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: whoami-h1
  namespace: scale-sentry-e2e
spec:
  selector: { app: whoami-h1 }
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: whoami-h1
  namespace: scale-sentry-e2e
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: whoami-h1
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami-h2
  namespace: scale-sentry-e2e
  labels: { app: whoami-h2 }
spec:
  replicas: 1
  selector: { matchLabels: { app: whoami-h2 } }
  template:
    metadata:
      labels: { app: whoami-h2 }
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.3
          # --h2c enables HTTP/2 cleartext on the listener so the loadgen's
          # ProtocolHTTP2 client (h2c prior-knowledge for http:// URLs)
          # negotiates without ALPN/TLS.
          args: ["--port=8080", "--h2c"]
          ports:
            - containerPort: 8080
              name: http2
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 64Mi }
          readinessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: whoami-h2
  namespace: scale-sentry-e2e
spec:
  selector: { app: whoami-h2 }
  ports:
    - name: http2
      port: 80
      targetPort: 8080
      # AppProtocol h2c lets Envoy Gateway pick HTTP/2 upstream framing.
      appProtocol: kubernetes.io/h2c
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: whoami-h2
  namespace: scale-sentry-e2e
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: whoami-h2
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
