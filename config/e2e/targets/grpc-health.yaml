# gRPC health-server target Deployment + Service + HPA.
#
# agnhost is the Kubernetes SIG-Testing e2e image; its grpc-health-checking
# subcommand serves the standard grpc.health.v1.Health probe (overall
# server health = SERVING). Hosted on registry.k8s.io (no docker.io rate
# limits) and multi-arch. Swap the image for your own gRPC service if it
# registers the standard Health probe (one-line helper for grpc-go:
# healthpb.RegisterHealthServer(srv, health.NewServer())).
#
# The Service marks appProtocol=grpc so Envoy Gateway routes h2 framing
# end-to-end without falling back to HTTP/1 upstream.
#
# Resources:
#   requests.cpu=20m, limits.cpu=200m; CPU-only HPA target=70% (~14m).
#   A unary Health/Check RPC is cheap: measured at 26-29m sustained under
#   the 200 RPS these validations drive. At the old 50m request that is
#   only ~55% utilisation, just under the 70% target, so the HPA scaled
#   solely on nights when a slow shared runner inflated the per-request
#   CPU cost enough to tip it over. 20m puts the same load at ~190%,
#   decisive on fast and slow hardware alike, and lands on 2 replicas:
#   scaling harder than that churns gRPC connections during rebalance
#   and pushes the failed-request ratio toward the 1% traffic-integrity
#   threshold, trading an SLA flake for a traffic one.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grpc-health
  namespace: scale-sentry-e2e
  labels: { app: grpc-health }
spec:
  replicas: 1
  selector: { matchLabels: { app: grpc-health } }
  template:
    metadata:
      labels: { app: grpc-health }
    spec:
      containers:
        - name: grpc
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          imagePullPolicy: IfNotPresent
          args: ["grpc-health-checking", "--port=50051"]
          ports:
            - containerPort: 50051
              name: grpc
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          readinessProbe:
            tcpSocket: { port: 50051 }
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: grpc-health
  namespace: scale-sentry-e2e
spec:
  selector: { app: grpc-health }
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
      appProtocol: grpc
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: grpc-health
  namespace: scale-sentry-e2e
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: grpc-health
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
