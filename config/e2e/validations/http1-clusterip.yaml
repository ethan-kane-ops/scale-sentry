# HTTP/1.1 against the whoami-h1 Service ClusterIP. Default Host
# resolution targets whoami-h1.scale-sentry-e2e.svc.cluster.local:80.
apiVersion: validation.scale-sentry.ek.co/v1beta1
kind: ScaleValidation
metadata:
  name: e2e-http1-clusterip
  namespace: scale-sentry-e2e
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: whoami-h1
  sla: 2m
  target:
    mode: ServiceDefault
    port: 80
    networkPath: ClusterIP
    protocol: HTTP1
  load:
    baseRps: 200
    concurrencyFactor: 50
    profile:
      pattern: Poisson
