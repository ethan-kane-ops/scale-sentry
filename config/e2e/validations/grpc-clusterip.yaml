# gRPC Health/Check against the grpc-health Service ClusterIP. The
# loadgen dials host:port (URL path ignored) and issues unary
# Health.Check RPCs at the configured rate.
apiVersion: validation.scale-sentry.ek.co/v1beta1
kind: ScaleValidation
metadata:
  name: e2e-grpc-clusterip
  namespace: scale-sentry-e2e
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: grpc-health
  sla: 2m
  target:
    mode: ServiceDefault
    port: 50051
    networkPath: ClusterIP
    protocol: GRPC
  load:
    baseRps: 200
    concurrencyFactor: 50
    profile:
      pattern: Poisson
