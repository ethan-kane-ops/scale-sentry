# HTTP/1.1 through the Envoy Gateway edge. Host overrides the default
# Service DNS so the loadgen hits the Gateway address; Envoy routes via
# HTTPRoute whoami-h1 back to the workload. The HPA fires on backend CPU
# the same way as the ClusterIP run; the Gateway-vs-direct latency delta
# is the load-balanced-edge cost the e2e is meant to surface.
apiVersion: validation.scale-sentry.ek.co/v1alpha1
kind: ScaleValidation
metadata:
  name: e2e-http1-gateway
  namespace: scale-sentry-e2e
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: whoami-h1
  sla: 2m
  target:
    mode: ServiceDefault
    port: 80
    networkPath: Gateway
    protocol: HTTP1
    # Envoy Gateway provisions the proxy Service as
    # envoy-<gw-ns>-<gw-name>-<hash> in envoy-gateway-system; the hash
    # is derived from the Gateway namespace/name, so this value is
    # stable for these fixtures. Discover yours with:
    #   kubectl -n envoy-gateway-system get svc \
    #     -l gateway.envoyproxy.io/owning-gateway-name=scale-sentry-eg
    host: envoy-scale-sentry-e2e-scale-sentry-eg-a090755d.envoy-gateway-system.svc.cluster.local
  load:
    baseRps: 200
    concurrencyFactor: 50
    profile:
      pattern: Poisson
