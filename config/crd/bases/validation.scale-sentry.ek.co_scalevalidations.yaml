---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: scalevalidations.validation.scale-sentry.ek.co
spec:
  group: validation.scale-sentry.ek.co
  names:
    kind: ScaleValidation
    listKind: ScaleValidationList
    plural: scalevalidations
    singular: scalevalidation
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.slaStatus
      name: SLA
      type: string
    - jsonPath: .status.trafficIntegrity
      name: Traffic
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ScaleValidation is the Schema for the scalevalidations API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ScaleValidationSpec defines the desired state of a ScaleValidation
              run.
            properties:
              disruption:
                description: Disruption configures optional chaos injection during
                  the validation.
                properties:
                  injectPodDeletion:
                    default: false
                    description: InjectPodDeletion enables terminating a healthy replica
                      during peak load.
                    type: boolean
                  minReplicasForChaos:
                    default: 2
                    description: |-
                      MinReplicasForChaos is the minimum replica count before chaos is allowed.
                      Prevents disruption from causing total unavailability.
                    format: int32
                    minimum: 2
                    type: integer
                  triggerDelay:
                    description: TriggerDelay is the duration to wait after load starts
                      before injecting chaos.
                    type: string
                required:
                - injectPodDeletion
                - minReplicasForChaos
                type: object
              load:
                description: Load defines the synthetic traffic profile parameters.
                properties:
                  baseRps:
                    description: BaseRPS is the starting requests-per-second before
                      dynamic scaling.
                    format: int32
                    type: integer
                  concurrencyFactor:
                    description: ConcurrencyFactor is multiplied by CPU cores to compute
                      target RPS.
                    format: int32
                    type: integer
                  profile:
                    description: |-
                      Profile selects the arrival-rate shape for the measurement
                      window. Default Constant (today's behaviour). Poisson is the
                      recommended choice for SLA-accurate verdicts because user
                      traffic is open-loop.
                    properties:
                      endRps:
                        description: EndRPS is the terminal rate for Ramp. Required
                          when Pattern=Ramp.
                        format: int32
                        type: integer
                      pattern:
                        default: Constant
                        description: Pattern is the arrival shape.
                        enum:
                        - Constant
                        - Poisson
                        - Ramp
                        - Step
                        - Spike
                        type: string
                      rampDuration:
                        description: |-
                          RampDuration is the wall-clock window over which Ramp interpolates
                          from BaseRPS to EndRPS. Required when Pattern=Ramp.
                        type: string
                      spikes:
                        description: |-
                          Spikes is the ordered list of spike windows to stitch into the
                          measurement phase. Required when Pattern=Spike.
                        items:
                          description: |-
                            SpikeWindow describes a single rate-elevated slice inside a Spike
                            measurement phase. At is measured from the start of the measurement
                            phase (post-warmup). Spikes are inserted between Constant base slices
                            at BaseRPS, so the resulting phase list is constant-spike-constant-...
                          properties:
                            at:
                              description: |-
                                At is the offset from measurement-phase start at which the spike
                                begins.
                              type: string
                            duration:
                              description: Duration is the wall-clock length of the
                                spike.
                              type: string
                            rps:
                              description: |-
                                RPS is the rate held during the spike. Must be > BaseRPS or the
                                "spike" would actually be a dip.
                              format: int32
                              type: integer
                          required:
                          - at
                          - duration
                          - rps
                          type: object
                        type: array
                      stepDuration:
                        description: |-
                          StepDuration is the wall-clock interval between Step climbs.
                          Required when Pattern=Step.
                        type: string
                      stepRps:
                        description: |-
                          StepRPS is the rate increment per StepDuration interval. Required
                          when Pattern=Step.
                        format: int32
                        type: integer
                    required:
                    - pattern
                    type: object
                  warmupDuration:
                    description: |-
                      WarmupDuration runs traffic against the target before the
                      measurement window opens. Requests are sent (so TCP/TLS handshakes
                      settle, JIT runs, caches warm) but their latencies and counters
                      are excluded from the SLA verdict. Default 0 (no warmup).
                    type: string
                required:
                - baseRps
                - concurrencyFactor
                type: object
              sla:
                description: SLA is the maximum allowed duration for HPA scale-up
                  and pod readiness.
                type: string
              target:
                description: Target configures the HTTP endpoint and network routing
                  for load traffic.
                properties:
                  customPath:
                    description: CustomPath is the explicit HTTP path to target. Used
                      when mode is CustomPath.
                    type: string
                  grpc:
                    description: |-
                      GRPC carries gRPC-specific knobs. Only consulted when Protocol=GRPC;
                      ignored otherwise. Empty (or unset) means probe overall server
                      health on the resolved Service host:port.
                    properties:
                      service:
                        description: |-
                          Service is the upstream service name passed to the Health/Check
                          probe (grpc.health.v1.HealthCheckRequest.service). Empty probes
                          overall server health. Use a non-empty value when the target
                          publishes multiple per-service health entries.
                        type: string
                    type: object
                  host:
                    description: |-
                      Host overrides the URL host the loadgen Job hits. Empty (default)
                      resolves to "<targetRef.name>.<namespace>.svc.cluster.local",
                      which is correct for ClusterIP runs against a Service that shares
                      the workload name. Set this to point load through an edge: e.g.
                      the Envoy Gateway address for a Gateway run, or the Ingress LB
                      hostname for the legacy Ingress path.
                    type: string
                  mode:
                    description: Mode determines how the load test target is resolved.
                    enum:
                    - ServiceDefault
                    - AutoDiscoverProbe
                    - CustomPath
                    type: string
                  networkPath:
                    default: ClusterIP
                    description: |-
                      NetworkPath determines the routing pathway for load traffic.
                      ClusterIP sends traffic directly to the Service inside the cluster.
                      Ingress sends traffic through a classic Ingress controller (legacy
                      path, prefer Gateway for new deployments). Gateway sends traffic
                      through a Gateway API edge (Envoy Gateway and friends). Only one
                      pathway runs per validation to isolate variables.
                    enum:
                    - ClusterIP
                    - Ingress
                    - Gateway
                    type: string
                  port:
                    description: Port is the target port number.
                    format: int32
                    type: integer
                  protocol:
                    default: HTTP1
                    description: |-
                      Protocol selects the wire protocol the loadgen speaks to the
                      target. HTTP1 uses fasthttp (default, backwards-compatible).
                      HTTP2 uses net/http + http2.Transport: ALPN-negotiated h2 for
                      https URLs, prior-knowledge h2c for http URLs. GRPC uses grpc-go
                      to invoke the standard grpc.health.v1.Health/Check probe; combine
                      with the optional GRPC block to scope the probe to a specific
                      upstream service.
                    enum:
                    - HTTP1
                    - HTTP2
                    - GRPC
                    type: string
                  tls:
                    description: |-
                      TLS configures HTTPS verification for the loadgen client. Only
                      applies when the resolved target URL uses the https scheme.
                    properties:
                      caBundle:
                        description: |-
                          CABundle points to a ConfigMap key containing one or more
                          PEM-encoded certificates trusted by the loadgen client.
                        properties:
                          configMapRef:
                            description: |-
                              ConfigMapRef selects a key in a ConfigMap in the same namespace as
                              the ScaleValidation.
                            properties:
                              key:
                                description: Key within the ConfigMap data block holding
                                  the PEM bundle.
                                type: string
                              name:
                                description: Name of the ConfigMap.
                                type: string
                            required:
                            - key
                            - name
                            type: object
                        required:
                        - configMapRef
                        type: object
                      insecureSkipVerify:
                        default: false
                        description: |-
                          InsecureSkipVerify disables certificate verification entirely.
                          Use only for dev / CI clusters; production runs should pin a CA.
                        type: boolean
                    type: object
                    x-kubernetes-validations:
                    - message: insecureSkipVerify and caBundle are mutually exclusive
                      rule: '!(self.insecureSkipVerify == true && has(self.caBundle))'
                required:
                - mode
                - networkPath
                - port
                type: object
              targetRef:
                description: TargetRef points to the workload to validate (e.g. a
                  Deployment).
                properties:
                  apiVersion:
                    description: API version of the referent.
                    type: string
                  kind:
                    description: Kind of the referent (e.g. Deployment).
                    type: string
                  name:
                    description: Name of the referent.
                    type: string
                required:
                - apiVersion
                - kind
                - name
                type: object
            required:
            - load
            - sla
            - target
            - targetRef
            type: object
          status:
            description: ScaleValidationStatus defines the observed state of a ScaleValidation
              run.
            properties:
              conditions:
                description: Conditions follow the standard Kubernetes conditions
                  pattern.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              diagnostics:
                description: Diagnostics contains the list of analysis findings.
                items:
                  description: DiagnosticAlert represents a single finding from the
                    analysis engine.
                  properties:
                    message:
                      description: Message is a human-readable description of the
                        finding.
                      type: string
                    recommendation:
                      description: Recommendation is the suggested remediation.
                      type: string
                    severity:
                      description: Severity is one of Info, Warning, or Critical.
                      enum:
                      - Info
                      - Warning
                      - Critical
                      type: string
                    type:
                      description: Type categorises the alert (e.g. "ProbeLeakage",
                        "CPUThrottling").
                      type: string
                  required:
                  - message
                  - severity
                  - type
                  type: object
                type: array
              failedRequests:
                description: FailedRequests is the number of HTTP requests that returned
                  errors.
                format: int64
                type: integer
              failureRate:
                description: FailureRate is the ratio of failed to total requests
                  (e.g. 0.0066 = 0.66%).
                type: number
              history:
                description: |-
                  History holds the most recent terminal runs, newest first, bounded to
                  RunHistoryLimit entries. Lets a single `kubectl get -o json` answer
                  "did this get worse over the last N releases" without a metrics stack.
                items:
                  description: |-
                    RunSummary is a compact record of one terminal run, kept in
                    ScaleValidationStatus.History so trend ("did this get worse over the
                    last N releases") is visible from `kubectl get -o json` alone, without
                    requiring a Prometheus scrape of scale_sentry_runs_total. Deliberately
                    excludes Diagnostics: that field can grow arbitrarily large per run,
                    which is fine for a single current-status snapshot but would make a
                    History slice's size unbounded.
                  properties:
                    failureRate:
                      description: FailureRate mirrors the top-level status.failureRate
                        at run completion.
                      type: number
                    finishedAt:
                      description: FinishedAt is when this run reached a terminal
                        phase.
                      format: date-time
                      type: string
                    phase:
                      description: Phase is the terminal phase this run reached (Succeeded
                        or Failed).
                      type: string
                    slaStatus:
                      description: SLAStatus mirrors the top-level status.slaStatus
                        at run completion.
                      enum:
                      - Pass
                      - Fail
                      - Unknown
                      type: string
                    trafficIntegrity:
                      description: TrafficIntegrity mirrors the top-level status.trafficIntegrity
                        at run completion.
                      enum:
                      - Pass
                      - Fail
                      - Unknown
                      type: string
                  required:
                  - finishedAt
                  - phase
                  type: object
                maxItems: 10
                type: array
              lastRunTime:
                description: LastRunTime is the timestamp of the most recent validation
                  execution.
                format: date-time
                type: string
              phase:
                description: Phase represents the current lifecycle state.
                enum:
                - Pending
                - Running
                - Succeeded
                - Failed
                - Error
                - Terminating
                type: string
              scaleUpDuration:
                description: ScaleUpDuration is the measured time from HPA trigger
                  to all replicas ready.
                type: string
              slaStatus:
                description: SLAStatus indicates whether the scaling met the configured
                  SLA.
                enum:
                - Pass
                - Fail
                - Unknown
                type: string
              totalRequests:
                description: TotalRequests is the total number of HTTP requests sent
                  during the run.
                format: int64
                type: integer
              trafficIntegrity:
                description: TrafficIntegrity indicates whether any requests were
                  dropped.
                enum:
                - Pass
                - Fail
                - Unknown
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
