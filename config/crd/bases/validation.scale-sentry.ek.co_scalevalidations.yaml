---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: scalevalidations.validation.scale-sentry.ek.co
spec:
  group: validation.scale-sentry.ek.co
  names:
    kind: ScaleValidation
    listKind: ScaleValidationList
    plural: scalevalidations
    singular: scalevalidation
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.slaStatus
      name: SLA
      type: string
    - jsonPath: .status.trafficIntegrity
      name: Traffic
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ScaleValidation is the Schema for the scalevalidations API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ScaleValidationSpec defines the desired state of a ScaleValidation
              run.
            properties:
              disruption:
                description: Disruption configures optional chaos injection during
                  the validation.
                properties:
                  injectPodDeletion:
                    default: false
                    description: InjectPodDeletion enables terminating a healthy replica
                      during peak load.
                    type: boolean
                  minReplicasForChaos:
                    default: 2
                    description: |-
                      MinReplicasForChaos is the minimum replica count before chaos is allowed.
                      Prevents disruption from causing total unavailability.
                    format: int32
                    minimum: 2
                    type: integer
                  triggerDelay:
                    description: TriggerDelay is the duration to wait after load starts
                      before injecting chaos.
                    type: string
                required:
                - injectPodDeletion
                - minReplicasForChaos
                type: object
              load:
                description: Load defines the synthetic traffic profile parameters.
                properties:
                  baseRps:
                    description: BaseRPS is the starting requests-per-second before
                      dynamic scaling.
                    format: int32
                    type: integer
                  concurrencyFactor:
                    description: ConcurrencyFactor is multiplied by CPU cores to compute
                      target RPS.
                    format: int32
                    type: integer
                required:
                - baseRps
                - concurrencyFactor
                type: object
              sla:
                description: SLA is the maximum allowed duration for HPA scale-up
                  and pod readiness.
                type: string
              target:
                description: Target configures the HTTP endpoint and network routing
                  for load traffic.
                properties:
                  customPath:
                    description: CustomPath is the explicit HTTP path to target. Used
                      when mode is CustomPath.
                    type: string
                  mode:
                    description: Mode determines how the load test target is resolved.
                    enum:
                    - ServiceDefault
                    - AutoDiscoverProbe
                    - CustomPath
                    type: string
                  networkPath:
                    default: ClusterIP
                    description: |-
                      NetworkPath determines the routing pathway for load traffic.
                      ClusterIP sends traffic directly to the Service inside the cluster.
                      Ingress sends traffic through the edge Ingress controller.
                      Only one pathway runs per validation to isolate variables.
                    enum:
                    - ClusterIP
                    - Ingress
                    type: string
                  port:
                    description: Port is the target port number.
                    format: int32
                    type: integer
                required:
                - mode
                - networkPath
                - port
                type: object
              targetRef:
                description: TargetRef points to the workload to validate (e.g. a
                  Deployment).
                properties:
                  apiVersion:
                    description: API version of the referent.
                    type: string
                  kind:
                    description: Kind of the referent (e.g. Deployment).
                    type: string
                  name:
                    description: Name of the referent.
                    type: string
                required:
                - apiVersion
                - kind
                - name
                type: object
            required:
            - load
            - sla
            - target
            - targetRef
            type: object
          status:
            description: ScaleValidationStatus defines the observed state of a ScaleValidation
              run.
            properties:
              conditions:
                description: Conditions follow the standard Kubernetes conditions
                  pattern.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              diagnostics:
                description: Diagnostics contains the list of analysis findings.
                items:
                  description: DiagnosticAlert represents a single finding from the
                    analysis engine.
                  properties:
                    message:
                      description: Message is a human-readable description of the
                        finding.
                      type: string
                    recommendation:
                      description: Recommendation is the suggested remediation.
                      type: string
                    severity:
                      description: Severity is one of Info, Warning, or Critical.
                      enum:
                      - Info
                      - Warning
                      - Critical
                      type: string
                    type:
                      description: Type categorises the alert (e.g. "ProbeLeakage",
                        "CPUThrottling").
                      type: string
                  required:
                  - message
                  - severity
                  - type
                  type: object
                type: array
              failedRequests:
                description: FailedRequests is the number of HTTP requests that returned
                  errors.
                format: int64
                type: integer
              failureRate:
                description: FailureRate is the ratio of failed to total requests
                  (e.g. 0.0066 = 0.66%).
                type: number
              lastRunTime:
                description: LastRunTime is the timestamp of the most recent validation
                  execution.
                format: date-time
                type: string
              phase:
                description: Phase represents the current lifecycle state.
                enum:
                - Pending
                - Running
                - Succeeded
                - Failed
                - Error
                type: string
              scaleUpDuration:
                description: ScaleUpDuration is the measured time from HPA trigger
                  to all replicas ready.
                type: string
              slaStatus:
                description: SLAStatus indicates whether the scaling met the configured
                  SLA.
                enum:
                - Pass
                - Fail
                - Unknown
                type: string
              totalRequests:
                description: TotalRequests is the total number of HTTP requests sent
                  during the run.
                format: int64
                type: integer
              trafficIntegrity:
                description: TrafficIntegrity indicates whether any requests were
                  dropped.
                enum:
                - Pass
                - Fail
                - Unknown
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
