# RBAC for the loadgen Job's observer sidecar. The observer reads the
# target workload's scale subresource, HPA, EndpointSlices, pods, and
# PodDisruptionBudgets within a single namespace, and scrapes the cAdvisor
# `/metrics/cadvisor` endpoint through the apiserver proxy for CFS
# throttle counters.
#
# The workload itself is only ever read through `<resource>/scale`, never
# as a whole object: the scale subresource carries the label selector the
# observer needs and nothing else. Targets outside apps/v1 need their own
# `<resource>/scale` grant added here.
#
# The proxy hop requires `nodes/proxy` (cluster-scoped), modelled as a
# ClusterRoleBinding to the same observer SA. The rest stays a namespaced
# Role since it only touches in-namespace objects. Namespace is applied at
# deploy time (see the Helm chart in ENG-38). This file is hand-written
# controller-gen only emits the manager-role from kubebuilder markers.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scale-sentry-observer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scale-sentry-observer
rules:
- apiGroups:
  - apps
  resources:
  - deployments/scale
  - replicasets/scale
  - statefulsets/scale
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - list
  - watch
- apiGroups:
  - autoscaling
  resources:
  - horizontalpodautoscalers
  verbs:
  - get
  - list
- apiGroups:
  - policy
  resources:
  - poddisruptionbudgets
  verbs:
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scale-sentry-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: scale-sentry-observer
subjects:
- kind: ServiceAccount
  name: scale-sentry-observer
---
# Cluster-scoped read for kubelet cAdvisor scraping. The verb is `get`
# on the nodes/proxy subresource, read-only and substantially lower
# privilege than the original `pods/exec` (`create`) on every workload
# container in the namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: scale-sentry-observer-cadvisor
rules:
- apiGroups:
  - ""
  resources:
  - nodes/proxy
  verbs:
  - get
