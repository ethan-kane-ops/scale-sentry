# TLS-enabled run targeting an HTTPS endpoint behind a private CA. The
# loadgen client trusts the PEM bundle stored in a ConfigMap living in the
# same namespace as the ScaleValidation. Use this when the target Service
# or Ingress is fronted by an internal certificate authority that the
# default system roots do not include.
#
# For a dev cluster with a self-signed cert, set insecureSkipVerify: true
# instead, leaving caBundle unset. Setting both is rejected by CRD
# validation (mutually exclusive).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: internal-ca
data:
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    # replace with the PEM-encoded CA certificate(s) trusted by your
    # private ingress or service mesh edge
    -----END CERTIFICATE-----
---
apiVersion: validation.scale-sentry.ek.co/v1beta1
kind: ScaleValidation
metadata:
  name: podinfo-tls
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: podinfo
  sla: 90s
  target:
    mode: CustomPath
    customPath: /healthz
    port: 8443
    networkPath: ClusterIP
    tls:
      caBundle:
        configMapRef:
          name: internal-ca
          key: ca.crt
  load:
    baseRps: 100
