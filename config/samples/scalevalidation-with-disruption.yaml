# Run with chaos disruption enabled — once peak load is reached, the
# controller's chaos planner picks a healthy replica and terminates it.
# The drain analyzer correlates the resulting endpoint-removal event with
# any loadgen errors that follow, surfacing UngracefulDrain diagnostics
# (missing preStop hook, SIGTERM propagation delay, etc.).
#
# minReplicasForChaos protects against self-inflicted total outage —
# chaos is skipped if the gate is not met.
apiVersion: validation.scale-sentry.ek.co/v1alpha1
kind: ScaleValidation
metadata:
  name: podinfo-disruption
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: podinfo
  sla: 120s
  target:
    mode: ServiceDefault
    port: 9898
    networkPath: ClusterIP
  load:
    baseRps: 100
    concurrencyFactor: 10
  disruption:
    injectPodDeletion: true
    minReplicasForChaos: 2
    triggerDelay: 30s
