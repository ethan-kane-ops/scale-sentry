apiVersion: validation.scale-sentry.ek.co/v1alpha1
kind: ScaleValidation
metadata:
  name: scalevalidation-sample
spec:
  # The workload under test. ENG-35 assumes a Service of the same name
  # fronts this Deployment.
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: my-app
  # Maximum allowed HPA scale-up + pod-readiness time.
  sla: 5m
  target:
    mode: ServiceDefault
    port: 8080
    networkPath: ClusterIP
  load:
    baseRps: 100
    concurrencyFactor: 10
  disruption:
    injectPodDeletion: true
    minReplicasForChaos: 3
